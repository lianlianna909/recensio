# ---------------------------------------------------------------------------
# D-04 落位声明（B5）：所有 object / list<object> 字段的存放位置。与提案 §3.0.7 逐行一致。
#   frontmatter      = 标量 / 标量列表 / wikilink 列表
#   swp:<name>       = 正文 ```yaml swp:<name>``` 块（可嵌套）
#   parallel_lists   = 若干等长标量列表（VR-53）
#   maps             = _maps/<msc>.map.yaml（纯 YAML）
# ---------------------------------------------------------------------------
d04_placement:
  x_ext:                         {placement: frontmatter, structured_part: "swp:meta#x_ext"}
  numbering_scheme:              {placement: parallel_lists, columns: [numbering_figure, numbering_table,
                                    numbering_equation, numbering_supplementary_prefix,
                                    numbering_continue_across_sections, numbering_locale]}
  section_meta:                  {placement: "swp:sections"}
  equation_meta:                 {placement: "swp:equations"}
  panel_layout:                  {placement: parallel_lists, columns: [panel_layout_cols, panel_layout_rows]}
  "Panel.crop":                  {placement: "swp:meta"}
  "Panel.crop_px":               {placement: "swp:meta"}
  "Panel.layout":                {placement: "swp:meta"}
  "Panel.canvas":                {placement: "swp:meta"}
  "Panel.source_size":           {placement: "swp:meta"}
  "Panel.transform":             {placement: "swp:meta"}
  "Panel.crop_history":          {placement: "swp:meta"}
  "RevisionIssue.targets":       {placement: "swp:targets", schema: "{par!, manuscript!, section?, quote_hint?, patch?}"}
  "Patch.targets":               {placement: "swp:targets", schema: "{par!, field?, operation?}"}
  authors:                       {placement: parallel_lists, columns: [author_names, author_affiliation_keys,
                                    author_orcids, author_corresponding]}
  affiliations:                  {placement: parallel_lists, columns: [affiliation_keys, affiliation_names,
                                    affiliation_departments, affiliation_cities, affiliation_countries]}
