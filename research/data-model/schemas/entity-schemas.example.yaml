  abbreviations:                 {placement: parallel_lists, columns: [abbreviation_keys, abbreviation_fulls]}
  "Method.parameters":           {placement: parallel_lists, columns: [parameter_keys, parameter_values,
                                    parameter_units]}
  "Method.software":             {placement: "swp:params"}
  "Method.reagents":             {placement: "swp:params"}
  "Experiment.conditions":       {placement: parallel_lists, columns: [condition_keys, condition_values,
